version: '3.8'

services:
  # Optional PostgreSQL - app uses SQLite by default
  # Uncomment and change DATABASE_URL in .env to use PostgreSQL
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: agriproof
  #     POSTGRES_USER: agriproof
  #     POSTGRES_PASSWORD: agriproof_secret
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./models:/app/models
      - ./circuits:/app/circuits
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./agriproof.db
      - APP_ENV=development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_URL=http://localhost:8000
    command: npm run dev -- --host

# volumes:
#   postgres_data:
